<!DOCTYPE html><html lang="fa" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NikiFamily | انجمن نیکی فمیلی</title>

<meta name="theme-color" content="#7c3aed">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head><body><header class="header">
    <div class="container">
        <h1>💜 NikiFamily</h1>
        <p>انجمن نیکی فمیلی</p>
    </div>
</header><main class="container"><section class="create-box">

    <h2>ساخت تاپیک جدید</h2>

    <input
        id="topicTitle"
        type="text"
        maxlength="100"
        placeholder="عنوان تاپیک"
        autocomplete="off"
    >

    <textarea
        id="topicDescription"
        maxlength="2000"
        placeholder="متن تاپیک را بنویسید..."
    ></textarea>

    <button id="createTopicBtn">
        + ساخت تاپیک
    </button>

    <p id="message"></p>

</section>


<section class="topics-section">

    <div class="section-title">

        <h2>تاپیک‌ها</h2>

        <button id="refreshBtn" class="refresh-btn">
            🔄 بروزرسانی
        </button>

    </div>

    <div id="topicsList">

        <div class="loading">
            در حال دریافت تاپیک‌ها...
        </div>

    </div>

</section>

</main><footer>
    <p>💜 NikiFamily</p>
</footer><script src="script.js"></script></body>
</html>

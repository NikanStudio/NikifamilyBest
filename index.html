</head><body><header class="header"><div class="container">

    <div class="logo">
        💜
    </div>

    <h1>
        NikiFamily
    </h1>

    <p>
        انجمن نیکی فمیلی
    </p>

</div>

</header><main class="container"><section class="intro">

    <h2>
        به نیکی فمیلی خوش آمدید 💜
    </h2>

    <p>
        اینجا می‌توانید تاپیک‌های جدید بسازید
        و نوشته‌های دیگران را مشاهده کنید.
    </p>

</section>


<section class="create-box">

    <h2>
        ساخت تاپیک جدید
    </h2>

    <input
        id="topicTitle"
        type="text"
        maxlength="100"
        placeholder="عنوان تاپیک"
        autocomplete="off"
    >

    <textarea
        id="topicDescription"
        maxlength="2000"
        placeholder="متن تاپیک را بنویسید..."
    ></textarea>

    <button id="createTopicBtn">
        + ساخت تاپیک
    </button>

    <p id="message"></p>

</section>


<section class="topics-section">

    <div class="section-title">

        <h2>
            تاپیک‌ها
        </h2>

        <button
            id="refreshBtn"
            class="refresh-btn">

            🔄 بروزرسانی

        </button>

    </div>


    <div id="topicsList">

        <div class="loading">
            در حال دریافت تاپیک‌ها...
        </div>

    </div>

</section>

</main><footer><p>
    💜 NikiFamily
</p>

<p>
    انجمن نیکی فمیلی
